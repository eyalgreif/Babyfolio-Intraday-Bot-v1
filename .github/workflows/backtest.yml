name: Intraday research backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run research backtest
        run: python bot.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: intraday-backtest-report
          path: reports/
          if-no-files-found: error
          retention-days: 30
